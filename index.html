window.addEventListener('DOMContentLoaded', function () {
  const PASSWORD_SHA256 = 'e9e4b696a951967378f68eb53259678df1bae493de121923beec52900a05ef4d';
  const SESSION_KEY = 'fangzhou_dashboard_auth_v1';
  const loginScreen = document.getElementById('loginScreen');
  const app = document.getElementById('dashboardApp');
  const error = document.getElementById('loginError');

  function unlock() {
    loginScreen.style.display = 'none';
    app.classList.remove('app-locked');
  }

  async function sha256(text) {
    const data = new TextEncoder().encode(text);
    const digest = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  if (sessionStorage.getItem(SESSION_KEY) === 'ok') unlock();

  document.getElementById('loginForm').addEventListener('submit', async function (event) {
    event.preventDefault();
    const password = document.getElementById('dashboardPassword').value;
    if (await sha256(password) === PASSWORD_SHA256) {
      sessionStorage.setItem(SESSION_KEY, 'ok');
      unlock();
    } else {
      error.textContent = '\u5bc6\u7801\u4e0d\u6b63\u786e\uff0c\u8bf7\u518d\u8bd5\u4e00\u6b21\u3002';

        <div class="lbl">点赞 ${(c.likes_wow != null) ? fmtDelta(c.likes_wow) : ''}</div>
      </div>
      <div class="kpi">
        <div class="val">${(c.shares).toLocaleString()}</div>
        <div class="lbl">分享</div>
      </div>
      <div class="kpi">
        <div class="val">${(c.followers_gained).toLocaleString()}</div>
        <div class="lbl">涨粉</div>
      </div>
    </div>
  </div>`).join('');
document.getElementById('cardsContainer').innerHTML = cardsHtml;

// ====== 柱状图 ======
if (D.bar && D.bar.series.length) {
  echarts.init(document.getElementById('chartBar')).setOption({
    tooltip: { trigger: 'axis', backgroundColor: '#1a1f2e', borderColor: '#2a3340', textStyle: { color: '#e4e8ef' } },
    legend: { textStyle: { color: '#8b9ab0' }, top: 0 },
    grid: { left: 60, right: 30, top: 50, bottom: 40 },
    xAxis: { type: 'category', data: D.bar.categories, axisLabel: { color: '#8b9ab0' }, axisLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'value', axisLabel: { color: '#8b9ab0' }, splitLine: { lineStyle: { color: '#1e293b' } } },
    series: D.bar.series
  });
}

// ====== 雷达图 ======
if (D.radar && D.radar.series.length) {
  echarts.init(document.getElementById('chartRadar')).setOption({
    tooltip: { backgroundColor: '#1a1f2e', borderColor: '#2a3340' },
    legend: { textStyle: { color: '#8b9ab0' }, top: 0 },
    radar: {
      indicator: D.radar.indicators,
      axisName: { color: '#8b9ab0' },
      center: ['50%', '55%'],
      radius: '65%',
      splitLine: { lineStyle: { color: '#1e293b' } },
    },
    series: [{ type: 'radar', data: D.radar.series, areaStyle: { opacity: 0.15 } }]
  });
}

// ====== 粉丝趋势 ======
if (D.follower && D.follower.dates.length) {
  echarts.init(document.getElementById('chartFollower')).setOption({
    tooltip: { trigger: 'axis', backgroundColor: '#1a1f2e', borderColor: '#2a3340' },
    legend: { textStyle: { color: '#8b9ab0' }, top: 0 },
    grid: { left: 60, right: 50, top: 50, bottom: 40 },
    xAxis: {
      type: 'category', data: D.follower.dates,
      axisLabel: { color: '#8b9ab0', rotate: 30, fontSize: 10 },
      axisLine: { lineStyle: { color: '#1e293b' } }
    },
    yAxis: [
      { type: 'value', name: '累计', nameTextStyle: { color: '#6b7a90' }, axisLabel: { color: '#8b9ab0' }, splitLine: { lineStyle: { color: '#1e293b' } } },
      { type: 'value', name: '日增减', nameTextStyle: { color: '#6b7a90' }, axisLabel: { color: '#8b9ab0' }, splitLine: { show: false } }
    ],
    series: [
      { name: '累计粉丝', type: 'line', data: D.follower.total, smooth: true,
        lineStyle: { color: '#576B95', width: 2.5 }, itemStyle: { color: '#576B95' },
        areaStyle: { color: 'rgba(87,107,149,0.1)' } },
      { name: '新关注', type: 'bar', yAxisIndex: 1, data: D.follower.new,
        itemStyle: { color: '#22c55e', borderRadius: [3,3,0,0] }, barGap: '0%' },
      { name: '取关', type: 'bar', yAxisIndex: 1, data: D.follower.lost,
        itemStyle: { color: '#ef4444', borderRadius: [3,3,0,0] } }
    ]
  });
} else {
  document.getElementById('chartFollower').parentElement.innerHTML +=
    '<div class="empty-state">暂无粉丝数据</div>';
}

// ====== 播放量趋势 ======
if (D.snapshotsTrend) {
  echarts.init(document.getElementById('chartTrend')).setOption({
    tooltip: { trigger: 'axis', backgroundColor: '#1a1f2e', borderColor: '#2a3340' },
    legend: { textStyle: { color: '#8b9ab0' }, top: 0 },
    grid: { left: 60, right: 30, top: 50, bottom: 40 },
    xAxis: {
      type: 'category', data: D.snapshotsTrend.dates,
      axisLabel: { color: '#8b9ab0' },
      axisLine: { lineStyle: { color: '#1e293b' } }
    },
    yAxis: { type: 'value', axisLabel: { color: '#8b9ab0' }, splitLine: { lineStyle: { color: '#1e293b' } } },
    series: D.snapshotsTrend.series
  });
} else {
  document.getElementById('chartTrend').parentElement.innerHTML +=
    '<div class="empty-state">📭 只有一次快照，积累更多数据后显示趋势</div>';
}

// ====== 散点图 ======
if (D.scatter && D.scatter.series.length) {
  const opt = {
    tooltip: {
      trigger: 'item',
      backgroundColor: '#1a1f2e',
      borderColor: '#2a3340',
      formatter: function(p) { return p.value[2] + '<br/>播放: ' + p.value[0].toLocaleString() + '<br/>互动率: ' + p.value[1] + '%'; }
    },
    legend: { textStyle: { color: '#8b9ab0' }, top: 0 },
    grid: { left: 70, right: 30, top: 50, bottom: 50 },
    xAxis: { type: 'value', name: '播放量', nameTextStyle: { color: '#6b7a90' }, axisLabel: { color: '#8b9ab0', formatter: function(v) { return (v/1000).toFixed(0)+'k'; } }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'value', name: '互动率 (%)', nameTextStyle: { color: '#6b7a90' }, axisLabel: { color: '#8b9ab0' }, splitLine: { lineStyle: { color: '#1e293b' } } },
    series: D.scatter.series
  };
  echarts.init(document.getElementById('chartScatter')).setOption(opt);
} else {
  document.getElementById('chartScatter').parentElement.innerHTML +=
    '<div class="empty-state">暂无数据</div>';
}

// ====== Top 表格 ======
document.getElementById('topTable').innerHTML = `
<table><thead><tr>
  <th>#</th><th>平台</th><th>标题</th>
  <th class="num">播放</th><th class="num">点赞</th><th class="num">分享</th><th class="num">互动率</th>
</tr></thead><tbody>
${D.top.map((r, i) => `<tr>
  <td>${i+1}</td>
  <td><span class="tag" style="background:${r.platform_color}">${r.platform}</span></td>
  <td>${r.title}</td>
  <td class="num">${r.views.toLocaleString()}</td>
  <td class="num">${r.likes ? r.likes.toLocaleString() : '-'}</td>
  <td class="num">${r.shares ? r.shares.toLocaleString() : '-'}</td>
  <td class="num" style="font-weight:600;color:${parseFloat(r.engagement) > 5 ? '#22c55e' : parseFloat(r.engagement) > 2 ? '#f59e0b' : '#8b9ab0'}">${r.engagement}</td>
</tr>`).join('')}
</tbody></table>`;

// ====== 时间筛选 ======
window.filterView = function(mode) {
  document.querySelectorAll('.time-filter button').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  // 预留: 未来根据 mode 切换数据展示 (月度 vs 周度)
};

</script>
</body>
</html>
